name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Tests and SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest --cov-report=xml

      - name: Run SAST with Bandit
        run: |
          pip install bandit
          bandit -r todo_project -x todo_project/tests -ll || true

      - name: Run SCA with pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Build Docker image
        run: |
          docker build -t task-manager:ci .

      - name: Run container
        run: |
          docker run -d --name task-manager-test -p 5000:5000 task-manager:ci

      - name: Wait application startup
        run: |
          sleep 15

      - name: Health Check
        run: |
          curl -I http://localhost:5000

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: false
          allow_issue_writing: false

